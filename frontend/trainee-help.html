<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SkillTrack | Help & Support</title>

    <link
        rel="stylesheet"
        href="trainee-dashboard.css"
    >

</head>


<body>

<header class="page-topbar">

    <a href="trainee-dashboard.html">
        ← Back to Dashboard
    </a>


    <div class="inner-brand">

        <div class="inner-logo">
            S
        </div>

        <div>

            <strong>
                SkillTrack
            </strong>

            <span>
                Help & Support
            </span>

        </div>

    </div>

</header>


<main class="inner-content">


    <div class="page-heading">

        <p>
            HELP & SUPPORT
        </p>

        <h1>
            How can we help?
        </h1>

        <span>
            Find answers about your training, certificate
            and post-training updates.
        </span>

    </div>


    <section class="faq">


        <button class="faq-item">

            <div>

                <strong>
                    How do I update my employment status?
                </strong>

                <p>
                    Your employment status can be updated through the Current Status section of your SkillTrack portal. Keep your status and employment details up to date so your post-training progress can be accurately tracked.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


        <button class="faq-item">

            <div>

                <strong>
                    When will I receive a follow-up?
                </strong>

                <p>
                    Follow-ups are conducted after training to understand your post-training progress and employment outcome. When a follow-up is available, you can view its details and status in the Follow-ups section.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


        <button class="faq-item">

            <div>

                <strong>
                  What should I do if my training information is incorrect?
                </strong>

                <p>
                    If any of your training details appear incorrect or incomplete, contact your training centre or SkillTrack support team. Keep your registration details handy so the issue can be verified and resolved.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


        <button class="faq-item">

            <div>

                <strong>
                    How do I change my profile information?
                </strong>

                <p>
                 Go to My Profile from the sidebar and select Edit Profile. Update the required information and save your changes. Your profile will then reflect the updated details.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


        <button class="faq-item">

            <div>

                <strong>
                    What information does SkillTrack track?
                </strong>

                <p>
                   SkillTrack helps track your training information, profile details, employment status, and post-training follow-ups. This information supports accurate monitoring of outcomes after training.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


    </section>


    <section class="support-card">

        <h2>
            Still need help?
        </h2>

        <p>
            Contact the official SkillTrack support channel
            for assistance with your trainee account.
        </p>

        <button
            class="primary-btn"
            id="supportBtn"
        >
            Contact Support
        </button>

        <div
            class="message"
            id="supportMessage"
        ></div>

    </section>


</main>


<script src="trainee-help.js"></script>

</body>

</html>
