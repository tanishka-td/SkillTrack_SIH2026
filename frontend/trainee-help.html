<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SkillTrack | Help & Support</title>

    <link
        rel="stylesheet"
        href="trainee-dashboard.css"
    >

</head>


<body>

<header class="page-topbar">

    <a href="trainee-dashboard.html">
        ← Back to Dashboard
    </a>


    <div class="inner-brand">

        <div class="inner-logo">
            S
        </div>

        <div>

            <strong>
                SkillTrack
            </strong>

            <span>
                Help & Support
            </span>

        </div>

    </div>

</header>


<main class="inner-content">


    <div class="page-heading">

        <p>
            HELP & SUPPORT
        </p>

        <h1>
            How can we help?
        </h1>

        <span>
            Find answers about your training, certificate
            and post-training updates.
        </span>

    </div>


    <section class="faq">


        <button class="faq-item">

            <div>

                <strong>
                    How do I update my employment status?
                </strong>

                <p>
                    Open Current Status from your dashboard
                    and select your latest career outcome.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


        <button class="faq-item">

            <div>

                <strong>
                    When will I receive a follow-up?
                </strong>

                <p>
                    SkillTrack uses scheduled 3, 6 and
                    12-month post-training check-ins.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


        <button class="faq-item">

            <div>

                <strong>
                    How can I view my certificate?
                </strong>

                <p>
                    Open My Certificate from the trainee
                    dashboard to view your digital credential.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


        <button class="faq-item">

            <div>

                <strong>
                    How do I change my profile information?
                </strong>

                <p>
                    Open My Profile, update the required
                    information and select Save Changes.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


        <button class="faq-item">

            <div>

                <strong>
                    What information does SkillTrack track?
                </strong>

                <p>
                    The trainee portal tracks training,
                    certification, current career status
                    and scheduled follow-up outcomes.
                </p>

            </div>

            <span>
                +
            </span>

        </button>


    </section>


    <section class="support-card">

        <h2>
            Still need help?
        </h2>

        <p>
            Contact the official SkillTrack support channel
            for assistance with your trainee account.
        </p>

        <button
            class="primary-btn"
            id="supportBtn"
        >
            Contact Support
        </button>

        <div
            class="message"
            id="supportMessage"
        ></div>

    </section>


</main>


<script src="trainee-help.js"></script>

</body>

</html>
