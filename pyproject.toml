[project]
name = "skilling-analytics"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sqlalchemy",
    "supabase",
    "faker",
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "streamlit",
    "plotly",
    "fastapi",
    "uvicorn",
    "anthropic",
    "python-dotenv"
]

[tool.vercel]
entrypoint = "api:app"